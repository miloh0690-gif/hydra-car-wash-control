<style>
:root{--bg:#0A0F2C;--bg2:#11183F;--bg3:#1A2352;--line:#263068;--text:#fff;--dim:#A9B0D0;--silver:#C9CBD0;--red:#E0243B;--red2:#B01A2D;--ok:#2FBF71}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.dim{color:var(--dim)}.hide{display:none!important}
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.logo{display:block;object-fit:contain}
#login .logo{width:200px;margin-bottom:10px}
.lcard{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:360px}
.lcard h2{text-align:center;margin-bottom:18px}
label{display:block;margin:12px 0 5px;font-size:.9rem;color:var(--dim)}
input,select{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
input:focus,select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 2px rgba(224,36,59,.3)}
.btn{padding:11px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:.9rem;font-weight:600}
.btn.p{background:var(--red);border-color:var(--red)}.btn.p:hover{background:var(--red2)}
.btn:disabled{opacity:.6;cursor:wait}
.lcard .btn{width:100%;margin-top:18px}
#err{display:none;margin-top:14px;padding:10px 14px;border:1px solid var(--red);border-radius:8px;background:rgba(224,36,59,.15);color:#ff8a8a;font-size:.9rem}
.app{display:flex;height:100vh;overflow:hidden}
.side{width:230px;background:var(--bg2);flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.side .logo{width:150px;margin:18px auto 12px}
.nav{padding:12px 20px;cursor:pointer;display:flex;gap:12px;align-items:center;font-size:.92rem}
.nav:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--silver)}
.nav:hover{background:var(--bg3)}.nav.on{background:var(--red)}.nav.on:before{background:#fff}
.nav.out{margin-top:auto;color:var(--dim)}
main{flex:1;overflow-y:auto;padding:22px}
.page-title{font-size:1.6rem;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{font-size:.8rem;color:var(--dim);margin-bottom:8px;font-weight:600}
.card .v{font-size:1.6rem;font-weight:700}.card small{color:var(--dim)}
.tw{overflow-x:auto;margin-bottom:16px}
table{width:100%;border-collapse:collapse;background:var(--bg2);border:1px solid var(--line)}
th,td{padding:11px 14px;text-align:left;font-size:.9rem}
th{background:var(--bg3);color:var(--dim);font-size:.75rem;text-transform:uppercase}
tr:nth-child(even) td{background:var(--bg)}
.sm{width:95px;padding:7px;text-align:center}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:8px;background:var(--ok);color:#fff;font-weight:600;z-index:900;display:none;max-width:90%}
#toast.bad{background:var(--red)}
#ham{display:none;position:fixed;top:12px;left:12px;z-index:600;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:#fff;font-size:1.3rem;cursor:pointer}
@media(max-width:768px){#ham{display:block}.side{position:fixed;left:-240px;height:100%;transition:left .3s;z-index:500}.side.show{left:0}main{padding:60px 14px 20px}}
</style>
</head>

<script>
// URL de la implementación (Apps Script > Implementar > Aplicación web). Debe terminar en /exec
const API_URL = 'https://script.google.com/macros/s/AKfycbxk8fR-pk2U4yfHwUD-v14N2RxvVzaqPSJuuIAqVLsNXE5Yyg6Qncpo2gCx8Siub6On/exec';
const S = { token: null, user: '', rol: '', personal: [], est: {} };
const $ = id => document.getElementById(id), C = () => $('page');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => 'Bs ' + Number(n || 0).toLocaleString('es-BO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hoy = () => { const d = new Date(); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); };

function aviso(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(aviso.t); aviso.t = setTimeout(() => t.style.display = 'none', 3500);
}

// Todas las llamadas al backend pasan por aquí (mensajes de error claros)
async function api(accion, datos) {
  let r, j;
  try {
    r = await fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion, token: S.token, datos: datos || {} }) });
  } catch (e) { throw new Error('Sin conexión con el servidor. Revisa tu internet y la URL de la implementación.'); }
  try { j = await r.json(); }
  catch (e) { throw new Error('El servidor no devolvió datos válidos. En Apps Script: Implementar > Administrar implementaciones > Nueva versión, con acceso "Cualquier usuario".'); }
  if (!j.ok) {
    if (j.error === 'SESION_EXPIRADA') { salir('Sesión expirada, ingresa de nuevo'); throw new Error('Sesión expirada'); }
    throw new Error(j.error || 'Error desconocido');
  }
  return j;
}

// ---------- Login ----------
function mostrarErr(m) { const e = $('err'); e.textContent = m; e.style.display = m ? 'block' : 'none'; }
async function entrar() {
  const u = $('u').value.trim(), pin = $('pin').value;
  mostrarErr('');
  if (!u || !pin) return mostrarErr('Ingresa usuario y PIN');
  $('go').disabled = true; $('go').textContent = 'Entrando...';
  try {
    const r = await api('login', { usuario: u, pin });
    S.token = r.token; S.user = r.nombre || r.usuario; S.rol = r.rol;
    $('login').classList.add('hide'); $('app').classList.remove('hide');
    ir('dashboard');
  } catch (e) { mostrarErr(e.message); }
  $('go').disabled = false; $('go').textContent = 'Entrar';
}
function salir(msg) {
  if (S.token) fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: 'logout', token: S.token }) }).catch(() => {});
  S.token = null; $('pin').value = '';
  $('app').classList.add('hide'); $('login').classList.remove('hide');
  mostrarErr(msg || '');
}

// ---------- Navegación ----------
function ir(p) {
  document.querySelectorAll('.nav[data-p]').forEach(n => n.classList.toggle('on', n.dataset.p === p));
  $('side').classList.remove('show');
  C().innerHTML = '<p class="dim">Cargando...</p>';
  PAGES[p]().catch(e => { C().innerHTML = '<p style="color:#ff8a8a">' + esc(e.message) + '</p><div class="bar"><button class="btn" onclick="ir(\'' + p + '\')">Reintentar</button></div>'; });
}
const titulo = t => '<h2 class="page-title">' + t + '</h2>';
const card = (h, v, s) => '<div class="card"><h3>' + h + '</h3><div class="v">' + v + '</div><small>' + s + '</small></div>';
const tabla = (cols, rows) => '<div class="tw"><table><thead><tr>' + cols.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' +
  (rows || '<tr><td colspan="' + cols.length + '" class="dim" style="text-align:center">Sin registros</td></tr>') + '</tbody></table></div>';
const cargarPersonal = async () => { S.personal = (await api('personal.listar')).datos; };
const mismo = (a, b) => String(a) === String(b);

const PAGES = {
  async dashboard() {
    await cargarPersonal();
    const a = (await api('asistencia.listar', { fecha: hoy() })).datos;
    let pres = 0, sin = 0, jor = 0;
    const rows = S.personal.map(p => {
      const x = a.find(r => mismo(r.id_personal, p.id_personal)), j = x ? Number(x.jornada) || 0 : 0;
      if (!x) sin++; else if (j > 0) pres++;
      jor += j * (Number(p.jornal_bs) || 0);
      return '<tr><td><strong>' + esc(p.nombre) + '</strong><br><small class="dim">' + esc(p.cargo) + '</small></td><td>' + money(p.jornal_bs) + '</td><td>' +
        (x ? esc(x.estado) : '<span class="dim">Sin registrar</span>') + '</td></tr>';
    }).join('');
    C().innerHTML = titulo('Panel de Hoy — ' + hoy()) + '<div class="grid">' + card('Personal presente', pres, 'de ' + S.personal.length + ' operadores') +
      card('Sin registrar', sin, 'operadores') + card('Jornal del día', money(jor), 'según asistencia') + '</div>' + tabla(['Operador', 'Jornal', 'Asistencia'], rows);
  },

  async asistencia() {
    await cargarPersonal();
    const a = (await api('asistencia.listar', { fecha: hoy() })).datos;
    S.est = {};
    S.personal.forEach(p => { const x = a.find(r => mismo(r.id_personal, p.id_personal)); S.est[p.id_personal] = x ? x.estado : 'Presente'; });
    const ops = ['Presente', '½ día', 'Falta', 'Permiso'];
    const rows = S.personal.map(p => '<tr><td><strong>' + esc(p.nombre) + '</strong></td><td><select data-chg="est" data-id="' + esc(p.id_personal) + '">' +
      ops.map(o => '<option' + (S.est[p.id_personal] === o ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></td></tr>').join('');
    C().innerHTML = titulo('Asistencia — ' + hoy()) + tabla(['Operador', 'Estado'], rows) +
      '<div class="bar"><button class="btn p" data-act="guardar">Guardar todo</button><button class="btn" data-act="todos">Marcar todos presentes</button></div>';
  },

  async personal() {
    await cargarPersonal();
    const rows = S.personal.map(p => '<tr><td><strong>' + esc(p.nombre) + '</strong><br><small class="dim">' + esc(p.cargo) + '</small></td>' +
      '<td><input type="number" class="sm" min="0" step="0.5" data-chg="jornal" data-id="' + esc(p.id_personal) + '" data-orig="' + (Number(p.jornal_bs) || 0) + '" value="' + (Number(p.jornal_bs) || 0) + '"></td>' +
      '<td><button class="btn" data-act="baja" data-id="' + esc(p.id_personal) + '">Dar de baja</button></td></tr>').join('');
    C().innerHTML = titulo('Personal') + tabla(['Operador', 'Jornal (Bs)', ''], rows) + '<div class="bar"><button class="btn p" data-act="agregar">+ Agregar personal</button></div>';
  },

  async planilla() {
    const [res, pag] = await Promise.all([api('planilla.pendientes'), api('planilla.listar')]);
    const rows = res.datos.map(p => '<tr><td><strong>' + esc(p.nombre) + '</strong></td><td>' + money(p.jornal_bs) + '</td><td>' + p.dias + '</td><td>' + (p.dias > 0 ? esc(p.periodo_desde) + ' → ' + esc(p.periodo_hasta) : '-') + '</td><td><strong>' + money(p.monto_por_pagar) + '</strong></td><td>' +
      '<button class="btn p" ' + (p.dias > 0 ? '' : 'disabled') + ' data-act="pagar" data-id="' + esc(p.id_personal) + '" data-n="' + esc(p.nombre) + '" data-d="' + p.dias + '" data-m="' + p.monto_por_pagar + '">Pagar</button></td></tr>').join('');
    const hist = pag.datos.map(p => '<tr><td>' + esc(p.fecha) + '</td><td>' + esc(p.nombre) + '</td><td>' + esc(p.dias) + '</td><td>' + esc(p.periodo_desde) + ' → ' + esc(p.periodo_hasta) + '</td><td>' + money(p.total_pagado) + '</td></tr>').join('');
    C().innerHTML = titulo('Pendientes de pago') + tabla(['Operador', 'Jornal', 'Días', 'Período', 'A pagar', ''], rows) +
      '<h3 style="margin:22px 0 12px">Pagos realizados</h3>' + tabla(['Fecha', 'Operador', 'Días', 'Período', 'Total'], hist);
  },

  async reportes() {
    const pag = (await api('planilla.listar')).datos, tot = {};
    pag.forEach(p => tot[p.nombre] = (tot[p.nombre] || 0) + (Number(p.total_pagado) || 0));
    C().innerHTML = titulo('Reportes') + '<div class="card"><h3>Total pagado por operador (Bs)</h3>' +
      (pag.length ? '<canvas id="ch" height="120"></canvas>' : '<p class="dim">Aún no hay pagos registrados</p>') + '</div>';
    if (pag.length && window.Chart) new Chart($('ch'), { type: 'bar', data: { labels: Object.keys(tot), datasets: [{ data: Object.values(tot), backgroundColor: '#E0243B' }] },
      options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#A9B0D0' } }, y: { ticks: { color: '#A9B0D0' }, beginAtZero: true } } } });
  },

  async admin() {
    C().innerHTML = titulo('Administración') + '<div class="card"><h3>Sesión</h3><p>' + esc(S.user) + ' · rol: ' + esc(S.rol) + '</p></div>' +
      '<div class="card" style="margin-top:14px"><h3>Conexión con Google Sheets</h3><button class="btn" data-act="probar">Probar conexión</button></div>';
  }
};

// ---------- Acciones (delegadas) ----------
const ACT = {
  async guardar() {
    await api('asistencia.guardar', { fecha: hoy(), lista: Object.keys(S.est).map(id => ({ id_personal: id, estado: S.est[id] })) });
    aviso('Asistencia guardada');
  },
  async todos() { document.querySelectorAll('select[data-chg="est"]').forEach(s => { s.value = 'Presente'; S.est[s.dataset.id] = 'Presente'; }); },
  async agregar() {
    const nombre = (prompt('Nombre del operador:') || '').trim(); if (!nombre) return;
    const cargo = (prompt('Cargo:', 'Lavador') || 'Lavador').trim();
    const jornal = parseFloat(prompt('Jornal diario (Bs):', '0')) || 0;
    await api('personal.crear', { nombre, cargo, jornal_bs: jornal }); aviso('Personal agregado'); ir('personal');
  },
  async baja(d) {
    if (!confirm('¿Dar de baja a este operador?')) return;
    await api('personal.editar', { id_personal: d.id, campo: 'estado', valor: 'Inactivo' }); aviso('Operador dado de baja'); ir('personal');
  },
  async pagar(d) {
    if (!confirm('Pagar ' + d.d + ' día(s) a ' + d.n + ' por ' + money(d.m) + '?')) return;
    const r = await api('planilla.pagar', { id_personal: d.id }); aviso('Pago registrado: ' + money(r.total_pagado)); ir('planilla');
  },
  async probar() { const t = Date.now(); await api('ping'); aviso('Conexión OK (' + (Date.now() - t) + ' ms)'); }
};
const CHG = {
  async est(el) { S.est[el.dataset.id] = el.value; },
  async jornal(el) {
    try { await api('personal.editar', { id_personal: el.dataset.id, campo: 'jornal_bs', valor: parseFloat(el.value) || 0 }); el.dataset.orig = el.value; aviso('Jornal actualizado'); }
    catch (e) { el.value = el.dataset.orig; throw e; }
  }
};
const guard = fn => async e => { try { await fn(e); } catch (err) { aviso(err.message, true); } };
C().addEventListener('click', guard(async e => { const b = e.target.closest('[data-act]'); if (b) await ACT[b.dataset.act](b.dataset); }));
C().addEventListener('change', guard(async e => { const el = e.target.closest('[data-chg]'); if (el) await CHG[el.dataset.chg](el); }));

$('go').addEventListener('click', entrar);
['u', 'pin'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); }));
document.querySelectorAll('.nav[data-p]').forEach(n => n.addEventListener('click', () => ir(n.dataset.p)));
$('logout').addEventListener('click', () => salir());
$('ham').addEventListener('click', () => $('side').classList.toggle('show'));
</script>
</body>
</html>
